name: Daily Twitter Ticker Update

on:
  schedule:
    # Run once daily at 8:00 PM local Pacific Time (which is 03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date to analyze (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write # Crucial permission to commit and push changes back to the repo

jobs:
  update-ticker-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history so git push works smoothly

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Twitter Scraping & Gemini Analysis
      env:
        # AI Credentials
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: "gemini-2.5-flash"
        
        # Twitter Credentials (Official X API or RapidAPI)
        X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        X_TARGET_USERNAME: ${{ secrets.X_TARGET_USERNAME }}
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      run: |
        # Runs fetch_and_analyze.py. If API is not set, it will automatically
        # utilize mock data so the job finishes successfully.
        if [ "${{ github.event.inputs.target_date }}" != "" ]; then
          echo "🎯 Manual trigger requested for date: ${{ github.event.inputs.target_date }}"
          python fetch_and_analyze.py --date "${{ github.event.inputs.target_date }}"
        else
          echo "🕒 Standard automatic trigger (defaulting to user local date)"
          python fetch_and_analyze.py
        fi

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are any changes to commit (either stock_data.json or backtest_results.json)
        CHANGES_EXIST=false
        if git status --porcelain | grep -q "data/stock_data.json"; then
          git add data/stock_data.json
          CHANGES_EXIST=true
        fi
        if git status --porcelain | grep -q "data/backtest_results.json"; then
          git add data/backtest_results.json
          CHANGES_EXIST=true
        fi
        
        if [ "$CHANGES_EXIST" = true ]; then
          echo "🔄 New data or backtest results generated. Committing changes..."
          git commit -m "auto: daily ticker analysis and backtest update [skip ci]"
          
          # Pull latest remote changes to avoid non-fast-forward rejection
          git pull --rebase origin main
          git push origin main
          echo "✅ Changes pushed successfully."
        else
          echo "ℹ️ No changes to commit (data is identical or no new updates)."
        fi

